# Campus HelpDesk reverse-proxy locations.
# Install helpdesk.logging.conf in the http context before using these locations.
#
# Paste these blocks INSIDE the existing HTTPS `server { ... }` block on the VM
# (the one holding `listen 443 ssl;` and `server_name jesoas.org;`). They add the
# new /helpdesk/ path and leave every existing location untouched, so the
# services already served from `/` and `/api` keep working unchanged.
#
# Apply with:
#   sudo nginx -t && sudo systemctl reload nginx
# `nginx -t` only validates the file. Nothing takes effect until the reload.

# Convenience redirect so /helpdesk reaches the application like /helpdesk/.
location = /helpdesk { return 301 /helpdesk/; }

location ^~ /helpdesk/ {
    access_log /var/log/helpdesk-nginx/access.log helpdesk if=$helpdesk_log_request;
    # Native error logs can include OAuth query strings. Use the structured
    # access event (including upstream status) and application errors instead.
    error_log /dev/null;

    # TEMPORARY: the development login is disabled by the application itself
    # when NODE_ENV=production, but while the VM runs in development mode this
    # endpoint would hand an ADMIN token to anyone posting a seeded address.
    #
    # This must live inside the location block. The ^~ prefix stops Nginx
    # evaluating regex locations for /helpdesk/, so a separate regex location
    # would never be reached, and an exact-match (=) location is not enough
    # either: Express routing is neither strict about a trailing slash nor case
    # sensitive, so /dev-login/, /DEV-LOGIN and /Dev-Login/ all reach the same
    # handler and only one spelling would be blocked. Matching $uri, which is
    # normalised and percent-decoded, case-insensitively with an optional
    # trailing slash covers every spelling.
    #
    # REMOVE once the deployment is permanently on NODE_ENV=production.
    if ($uri ~* "^/helpdesk/api/v1/auth/dev-login/?$") { return 404; }

    # The trailing slash is required: it strips the /helpdesk prefix so the
    # application receives its own absolute paths (/health, /api/v1/...).
    # Without it every proxied request reaches the application as /helpdesk/...
    # and returns 404.
    proxy_pass http://127.0.0.1:3001/;

    # ^~ above stops Nginx from testing regex locations for this prefix, so a
    # regex block elsewhere in the server (for example `location ~ \.php$`)
    # can never intercept a HelpDesk request.

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}

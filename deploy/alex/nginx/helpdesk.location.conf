# Campus HelpDesk reverse-proxy and static locations.
#
# deploy.sh installs this file as /etc/nginx/snippets/helpdesk.locations.conf,
# together with the logging configuration it depends on. Do not paste these
# blocks into the server block: that block also serves unrelated applications,
# and copying by hand is how a stale or missing file broke a reload before.
#
# The server block needs exactly one line, added once by hand inside the HTTPS
# `server { ... }` for this host:
#
#   include snippets/helpdesk.locations.conf;
#
# Everything here adds only the /helpdesk/ path and leaves every existing
# location untouched, so the services already served from `/` and `/api` keep
# working unchanged. deploy.sh reloads Nginx when any of these files change.
#
# ---------------------------------------------------------------------------
# How these blocks divide the path, and why the order of precedence matters.
#
# Nginx picks a location by rule, not by file order: an exact (=) match wins
# first, then the LONGEST ^~ prefix, then regular expressions, then plain
# prefixes. That is what keeps the single-page application from swallowing the
# API:
#
#   = /helpdesk/health        -> API   (exact beats everything)
#   = /helpdesk/ready         -> API
#   ^~ /helpdesk/api/         -> API   (longer prefix than /helpdesk/)
#   ^~ /helpdesk/assets/      -> static, immutable
#   = /helpdesk/index.html    -> static, never cached
#   ^~ /helpdesk/             -> the application shell, with history fallback
#
# /health and /ready need their own exact locations. Without them they would
# fall into the shell location below and return index.html with status 200,
# which would make deploy.sh report a healthy release while the API was down.
# ---------------------------------------------------------------------------

# Convenience redirect so /helpdesk reaches the application like /helpdesk/.
location = /helpdesk { return 301 /helpdesk/; }

# --- API -------------------------------------------------------------------

location = /helpdesk/health {
    include snippets/helpdesk.proxy.conf;
    proxy_pass http://127.0.0.1:3001/health;
}

location = /helpdesk/ready {
    include snippets/helpdesk.proxy.conf;
    proxy_pass http://127.0.0.1:3001/ready;
}

location ^~ /helpdesk/api/ {
    include snippets/helpdesk.proxy.conf;

    # TEMPORARY: the development login is disabled by the application itself
    # when NODE_ENV=production, but while the VM runs in development mode this
    # endpoint would hand an ADMIN token to anyone posting a seeded address.
    #
    # This must live inside the location block. The ^~ prefix stops Nginx
    # evaluating regex locations for this path, so a separate regex location
    # would never be reached, and an exact-match (=) location is not enough
    # either: Express routing is neither strict about a trailing slash nor case
    # sensitive, so /dev-login/, /DEV-LOGIN and /Dev-Login/ all reach the same
    # handler and only one spelling would be blocked. Matching $uri, which is
    # normalised and percent-decoded, case-insensitively with an optional
    # trailing slash covers every spelling.
    #
    # REMOVE once the deployment is permanently on NODE_ENV=production.
    if ($uri ~* "^/helpdesk/api/v1/auth/dev-login/?$") { return 404; }

    # The trailing /api/ replaces the matched /helpdesk/api/ prefix, so the
    # application receives its own absolute paths: /helpdesk/api/v1/tickets
    # arrives as /api/v1/tickets.
    proxy_pass http://127.0.0.1:3001/api/;
}

# --- Single-page application ------------------------------------------------
#
# The build is published to /var/www/helpdesk. `root /var/www` rather than
# `alias` is deliberate: with root, the URL path and the directory name line up
# (/helpdesk/x -> /var/www/helpdesk/x), which keeps try_files straightforward.
# alias combined with try_files resolves the fallback against the request URI
# and is a well-known source of confusing 404s.

location ^~ /helpdesk/assets/ {
    root /var/www;
    # Vite fingerprints these filenames, so a stale copy can never be served
    # under a name that has changed.
    # One explicit header rather than `expires` plus add_header, which would
    # emit Cache-Control twice.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location = /helpdesk/index.html {
    root /var/www;
    # The shell must never be cached: it carries the script tags that point at
    # the current fingerprinted bundle. A cached shell pins users to a deleted
    # bundle after a release.
    add_header Cache-Control "no-store" always;
}

location ^~ /helpdesk/ {
    root /var/www;
    access_log /var/log/helpdesk-nginx/access.log helpdesk if=$helpdesk_log_request;
    error_log /dev/null;

    # Client-side routing: a reload of /helpdesk/tickets/5 has no file on disk,
    # so serve the shell and let the router resolve the path. The fallback is an
    # internal redirect, which re-enters location matching and lands on the
    # exact index.html block above, so it inherits the no-store header.
    try_files $uri $uri/ /helpdesk/index.html;
}

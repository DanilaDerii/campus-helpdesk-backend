# Shared proxy settings for every HelpDesk API location.
#
# Install as a snippet so the API locations cannot drift apart:
#   sudo install -m 0644 deploy/alex/nginx/helpdesk.proxy.conf /etc/nginx/snippets/helpdesk.proxy.conf
#
# Include it inside each API location, then set that location's own proxy_pass.
# proxy_pass is deliberately NOT here: each location rewrites a different prefix.

access_log /var/log/helpdesk-nginx/access.log helpdesk if=$helpdesk_log_request;

# Native error logs can include OAuth query strings. Use the structured access
# event, which carries the upstream status, and the application's own logs.
error_log /dev/null;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_read_timeout    30s;

# Install in /etc/nginx/conf.d/ (inside the http context).
log_format helpdesk escape=json
    '{"time":"$time_iso8601","requestId":"$upstream_http_x_request_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"upstreamStatus":"$upstream_status","durationSeconds":$request_time}';

map "$uri:$status" $helpdesk_log_request {
    default 1;
    ~*^/helpdesk/(health|ready)/?:[23][0-9][0-9]$ 0;
}

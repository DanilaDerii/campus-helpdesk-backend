# Campus HelpDesk locations. deploy.sh installs this as
# /etc/nginx/snippets/helpdesk.locations.conf; the HTTPS server block includes it:
#
#   include snippets/helpdesk.locations.conf;
#
# Nginx picks exact (=) matches first, then the longest ^~ prefix. /health and
# /ready need exact locations, or the SPA fallback would answer them with index.html.

location = /helpdesk { return 301 /helpdesk/; }

# --- API -------------------------------------------------------------------

location = /helpdesk/health {
    include snippets/helpdesk.proxy.conf;
    proxy_pass http://127.0.0.1:3001/health;
}

location = /helpdesk/ready {
    include snippets/helpdesk.proxy.conf;
    proxy_pass http://127.0.0.1:3001/ready;
}

location ^~ /helpdesk/api/ {
    include snippets/helpdesk.proxy.conf;

    # The application disables dev-login in production; this also blocks it at
    # the proxy, for every spelling Express would accept.
    if ($uri ~* "^/helpdesk/api/v1/auth/dev-login/?$") { return 404; }

    # /helpdesk/api/v1/tickets reaches the application as /api/v1/tickets.
    proxy_pass http://127.0.0.1:3001/api/;
}

# --- Single-page application (built into /var/www/helpdesk) ----------------

location ^~ /helpdesk/assets/ {
    root /var/www;
    # Vite fingerprints these filenames.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location = /helpdesk/index.html {
    root /var/www;
    # Never cache the shell; it references the current bundle.
    add_header Cache-Control "no-store" always;
}

location ^~ /helpdesk/ {
    root /var/www;

    # Client-side routes fall back to index.html (and its no-store location).
    try_files $uri $uri/ /helpdesk/index.html;
}

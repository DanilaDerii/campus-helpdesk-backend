services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - helpdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helpdesk_postgres_data:
